# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception

name: Run on all Beman libraries

on:
  schedule:
    - cron: '0 6 * * 0' # Weekly on Sunday 09:00 EEST
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

jobs:
  parse-libraries:
    name: Parse Beman library list
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-on-all-libraries')
    runs-on: ubuntu-latest
    outputs:
      libraries: ${{ steps.parse.outputs.libraries }}
    steps:
      - name: Fetch libraries.md from bemanproject/website
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/bemanproject/website/main/src/pages/libraries.md \
            -o libraries.md

      - name: Parse library repo names
        id: parse
        run: |
          python3 - << 'EOF'
          import re, json, os

          with open("libraries.md") as f:
              content = f.read()

          # Excluded: exemplar (template repo, tested separately) and retired libs
          excluded = {"exemplar", "dump"}

          libs = []
          for line in content.splitlines():
              if "Retired" in line:
                  continue
              m = re.search(
                  r'\[beman\.\w+\]\(https://github\.com/bemanproject/(\w+)\)', line
              )
              if m:
                  repo = m.group(1)
                  if repo not in excluded:
                      libs.append(repo)

          output = f"libraries={json.dumps(libs)}"
          print(output)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(output + "\n")
          EOF

  run-beman-tidy:
    name: beman.${{ matrix.repo }}
    needs: parse-libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.parse-libraries.outputs.libraries) }}
    steps:
      - name: Checkout beman-tidy
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build and install beman-tidy
        run: |
          uv build
          uv tool install --force dist/*.whl
          beman-tidy --version

      - name: Clone beman.${{ matrix.repo }}
        run: |
          git clone --depth=1 https://github.com/bemanproject/${{ matrix.repo }}.git

      - name: Run beman-tidy on beman.${{ matrix.repo }}
        run: |
          # The exit code is the number of failed checks, and an uncaught
          # exception also exits with 1, so detect crashes from the output.
          # Failed checks are acceptable: libraries may have open violations.
          set +e
          beman-tidy --verbose ${{ matrix.repo }}/ 2>&1 | tee beman-tidy.log
          exit_code=${PIPESTATUS[0]}
          set -e
          if grep -q '^Traceback' beman-tidy.log || ! grep -q 'beman-tidy pipeline finished' beman-tidy.log; then
            echo "::error::beman-tidy crashed on beman.${{ matrix.repo }} (exit code ${exit_code})"
            exit 1
          fi
          echo "beman-tidy finished on beman.${{ matrix.repo }} with ${exit_code} failed checks"
          exit 0

  create-issue-when-fault:
    needs: [run-beman-tidy]
    if: failure() && (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    permissions: {}
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-create-issue-when-fault.yml@1.1.0
